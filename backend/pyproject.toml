[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "juno-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",

    # Apple In-App Purchase — verifies the signed JWS payloads StoreKit and the
    # App Store server send. Apple's own library rather than hand-rolled x5c
    # chain walking, because a forged payload here is a free subscription.
    "app-store-server-library>=3.1.2",

    # Validation & config
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    # IANA timezone database for slim containers and Windows hosts.
    "tzdata>=2025.2",

    # LiveKit — voice pipeline (STT: Deepgram, LLM: OpenAI/Anthropic/Gemini, TTS: Cartesia, VAD: Silero)
    # >=1.6.4: async tools (ctx.update / ctx.with_filler, 1.6.0) used by
    # draft_outbound_message; 1.6.1+ ships the audio Turn Detector v1, which is
    # built into livekit-agents itself (livekit.agents.inference.TurnDetector).
    #
    # The `turn-detector` extra is deliberately absent. It installs the
    # deprecated TEXT turn detector (livekit-plugins-turn-detector, removal
    # slated for Agents 2.0), which pulls in transformers + onnxruntime +
    # huggingface-hub and a ~396MB model download. That transformers import is
    # what logged `[transformers] PyTorch was not found` as an ERROR on every
    # worker boot. Do not add it back — see build_turn_detector() in
    # src/agent/voice/pipelines.py.
    "livekit-agents[deepgram,anthropic,cartesia,silero,google,openai]>=1.6.4",
    "livekit-api>=0.7",

    # Inbound voice isolation (ai-coustics Voice Focus 2.1 S) for the voice worker,
    # wired in voice/pipelines.py build_noise_cancellation(). NOT a livekit-agents
    # extra — it ships as its own distribution, which is why the voice-worker deps
    # guard has to look past the extras list to find it.
    "livekit-plugins-ai-coustics>=0.3.1",

    # Anthropic Claude
    "anthropic>=0.52",

    # OpenAI — GPT chat-fallback tier (services/openai_chat_fallback.py). Previously only
    # pulled in transitively via livekit-agents[openai] for the voice worker; now imported
    # directly by the text-chat path too, so it needs its own explicit floor.
    "openai>=1.50",

    # Firebase
    "firebase-admin>=6.7",

    # Google Calendar
    "google-api-python-client>=2.168",
    "google-auth>=2.40",
    "google-auth-httplib2>=0.2",

    # Google Gen AI SDK (Gemini — embeddings, cheap-tier model calls)
    "google-genai>=1.0",

    # Google Cloud Tasks (durable delayed job scheduling)
    "google-cloud-tasks>=2.16",

    # Google Cloud Storage (screen-save images, services/gcs.py). Already pulled in
    # transitively via firebase-admin, but declared explicitly since it's now imported
    # directly (same reasoning as the openai>=1.50 floor above).
    "google-cloud-storage>=2.18",

    # Full FLAC decode validation for Meeting Recording V2 completion gates.
    "soundfile>=0.13",

    # RSS feed parsing (daily notification news fallback)
    "feedparser>=6.0",

    # MCP server SDK (FastMCP — POST /mcp endpoint for voice agent tool calls)
    "mcp>=1.0",

    # Async HTTP clients for scheduled agent data fetchers
    "httpx>=0.28",

    # PostHog — server-side product analytics (notification re-engagement funnel).
    # Pinned to the 5.x line (installed + tested locally: 5.4.0). The
    # Posthog(project_api_key=..., host=...) ctor and capture(distinct_id, event,
    # properties) signature this code calls are verified against 5.x.
    "posthog>=5.4,<6",

    # Langfuse — LLM observability write side (services/analytics/llm_telemetry.py).
    # v3 is the OTel-based SDK line; batched background ingestion, atexit flush.
    "langfuse>=3.0",

    # Arize AX tracing. Exact pins keep its OpenTelemetry instrumentors aligned
    # with LiveKit Agents' existing 1.39.x OpenTelemetry dependency family.
    "arize-otel==0.13.0",
    "openinference-instrumentation==0.1.56",
    "openinference-semantic-conventions==0.1.31",
    "openinference-instrumentation-openai==0.1.53",
    "openinference-instrumentation-anthropic==1.1.0",
    "openinference-instrumentation-google-genai==1.3.0",

    # Backend operational errors. Meeting V2 attaches opaque correlation,
    # meeting, run, fence, job, and stable error-code tags only (never audio,
    # transcript, participant, token, or raw provider content).
    "sentry-sdk>=2.0",

    # Pillow — downscales desktop screen frames before they reach the vision model
    # (agent/voice/screen_frames.py). Present transitively before this, which is
    # exactly the kind of undeclared dependency that works locally and fails in the
    # Docker build, so it carries its own floor.
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "pyright>=1.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "tiktoken>=0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = []

[tool.coverage.run]
source = ["src"]
omit = [
    "src/agent/*",
    "src/agents/*",
    "src/handlers/chat.py",
    "src/handlers/connectors.py",
    "src/handlers/devices.py",
    "src/handlers/engagement.py",
    "src/handlers/notification_reply.py",
    "src/handlers/scheduled_agents.py",
    "src/main.py",
    "src/services/claude_client.py",
    "src/services/engagement/*",
    "src/services/google_calendar_connector.py",
    "src/services/model_provider.py",
    "src/services/request_auth.py",
    "src/services/tool_executor.py",
    "src/shared/*",
    "src/services/query_log.py",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.services.product_knowledge" = ["content/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
