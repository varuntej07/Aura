<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Aura Ops</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="architecture-twin.css" />
</head>
<body>
  <div id="gate" hidden>
    <div class="gate-card">
      <div class="brand"><span class="dot"></span>AURA OPS</div>
      <p class="muted">Founder console. Passcode required.</p>
      <input id="pc" type="password" placeholder="Passcode" autocomplete="current-password" />
      <button class="primary" id="enter">Open console</button>
      <p id="gateMsg" class="bad"></p>
    </div>
  </div>

  <div id="app" hidden>
    <header>
      <div class="brand"><span class="dot"></span>AURA OPS</div>
      <nav id="tabs" aria-label="Dashboard sections">
        <button class="tab active" data-tab="overview">Overview</button>
        <button class="tab" data-tab="mobile">Mobile</button>
        <button class="tab" data-tab="desktop">Desktop</button>
        <button class="tab" data-tab="web">Web</button>
        <button class="tab" data-tab="costs">Costs</button>
        <button class="tab" data-tab="architecture">Architecture</button>
        <button class="tab" data-tab="logs">Logs</button>
      </nav>
      <div class="header-actions">
        <span id="stamp" class="muted"></span>
        <button id="refresh" title="Refresh active tab">Refresh</button>
        <button id="lock" title="Forget passcode">Lock</button>
        <button id="shortcuts" class="icon-btn" title="Keyboard shortcuts" aria-label="Keyboard shortcuts" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.1 9a3 3 0 1 1 4 2.8c-.8.3-1.1 1-1.1 1.7v.5M12 17.5v.5"
            stroke="currentColor" stroke-width="2.1" stroke-linecap="round" fill="none"/></svg>
        </button>
      </div>
    </header>
    <main class="wrap" id="content"></main>
    <aside id="drawer" class="drawer" hidden aria-label="User detail"></aside>
    <div id="shortcutsPop" class="popover" hidden role="dialog" aria-label="Keyboard shortcuts">
      <h3>Shortcuts</h3>
      <dl>
        <dt><kbd>1</kbd>&ndash;<kbd>7</kbd></dt><dd>Switch tab</dd>
        <dt><kbd>r</kbd></dt><dd>Refresh this tab</dd>
        <dt><kbd>/</kbd></dt><dd>Focus search</dd>
        <dt><kbd>Esc</kbd></dt><dd>Close panel</dd>
      </dl>
    </div>
  </div>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="time.js"></script>
  <script src="brands.js"></script>
  <script src="architecture-twin.js"></script>
  <script src="app.js"></script>
</body>
</html>
